name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:frontend-assets
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - run: npm test
      - run: git diff --check
