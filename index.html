<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hausverwaltung Prototyp</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hausverwaltung">
    <link rel="manifest" href="manifest.webmanifest?v=20261111-pwa-v1">
    <link rel="icon" type="image/png" href="favicon.png?v=20261022">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=20261111-pwa-v1">
    <link rel="stylesheet" href="style.css?v=20261114-payment-duplicate-warning-v1">
</head>
<body>
    <div class="container" style="max-width: 1180px; margin: 0 auto; padding: 20px; font-family: sans-serif;">
        <header style="border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px;">
            <h1 style="margin: 0;">Hausverwaltung</h1>
            <div id="sync-status" style="font-size: 0.85em; margin-top: 5px; color: #666;">Prüfe Verbindung...</div>
            <div id="sync-queue-status" class="sync-queue-status" role="status" aria-live="polite" style="display:none;"></div>
            <div id="environment-banner" class="environment-banner" role="status" hidden>
                <div>
                    <strong id="environment-banner-label"></strong>
                    <span id="environment-banner-meta"></span>
                </div>
                <label class="environment-switch-label" for="environment-switch">
                    Umgebung
                    <select id="environment-switch" aria-label="Laufzeitumgebung wechseln" hidden></select>
                </label>
            </div>
        </header>

        <nav style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
            <button id="nav-meter-entry" class="tab-btn-active" onclick="uiService.showMeterEntryView()" style="padding:10px 14px; cursor:pointer;">
                Zähler
            </button>
            <button id="nav-consumption-dashboard" class="tab-btn-inactive" onclick="uiService.showConsumptionDashboard()" style="padding:10px 14px; cursor:pointer;">
                Verbrauch
            </button>
            <button id="nav-contracts" class="tab-btn-inactive" onclick="contractUiService.show()" style="padding:10px 14px; cursor:pointer;">Verträge</button>
            <button id="nav-payments" class="tab-btn-inactive" onclick="paymentUiService.show()" style="padding:10px 14px; cursor:pointer;">Mieteingänge</button>
        </nav>

        <section id="contracts-section" style="display:none;">
            <h2>Mietverträge</h2>
            <div id="contracts-output"></div>
        </section>

        <section id="object-selector-section">
            <h2 style="font-size: 1.1em; color: #444;">Haus auswählen:</h2>
            <div id="object-selector">Lade Objekte...</div>
        </section>

        <section id="unit-list-section" style="margin-top: 20px; display: none;">
            <div id="tenant-list"></div>
        </section>

        <section id="consumption-dashboard-section" style="display:none;">
            <div style="display:grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 180px); gap:10px; align-items:end; margin-bottom:12px;">
                <label style="display:flex; flex-direction:column; gap:4px; font-weight:700; color:#334155;">
                    Objekt
                    <select id="consumption-object-select" onchange="this.dataset.userSelected='true'; uiService.renderConsumptionDashboard()"></select>
                </label>
                <label style="display:flex; flex-direction:column; gap:4px; font-weight:700; color:#334155;">
                    Jahr
                    <select id="consumption-year-select" onchange="this.dataset.userSelected='true'; uiService.renderConsumptionDashboard()"></select>
                </label>
            </div>

            <label style="display:flex; align-items:center; gap:8px; margin-bottom:14px; color:#475569; font-weight:700;">
                <input id="consumption-include-calculated" type="checkbox" checked onchange="uiService.renderConsumptionDashboard()" style="width:auto;">
                berechnete Zähler anzeigen
            </label>

            <label style="display:flex; flex-direction:column; gap:4px; max-width:280px; margin-bottom:14px; font-weight:700; color:#334155;">
                Tabellenfilter
                <select id="consumption-status-filter" onchange="uiService.renderConsumptionDashboard()">
                    <option value="all">Alle Zähler</option>
                    <option value="missing">Nur fehlende Werte</option>
                    <option value="warnings">Nur Warnungen</option>
                </select>
            </label>

            <div class="consumption-refresh-bar">
                <button id="refresh-consumption-views" class="btn-primary" type="button" onclick="uiService.refreshConsumptionViews()">
                    Verbrauchsdaten aktualisieren
                </button>
                <span id="consumption-view-refresh-status" class="consumption-refresh-status" role="status" aria-live="polite"></span>
            </div>

            <div id="consumption-dashboard-output"></div>
        </section>

        <section id="payments-section" style="display:none;">
            <div id="payments-output"></div>
        </section>

        <div id="modal-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; padding:16px; overflow:auto;">
            <div style="background:white; width:min(100%, 960px); max-height:calc(100vh - 32px); margin:0 auto; padding:24px 28px; border-radius:16px; position:relative; overflow:auto;">
                <span style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer;" onclick="uiService.closeModal()">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>
    
    <!-- Optional: lokale Test-/Produktionsauswahl, niemals committen. -->
    <script src="runtime-secrets.js?v=20261112-local-secrets-v1" onerror="this.remove()"></script>
    <script src="runtime-config.js?v=20261110-runtime-config-v1" onerror="this.remove()"></script>
    <script src="config.js?v=20260707-consumption-dashboard-controls-v1"></script>
    <script src="environment-service.js?v=20261110-environment-switch-v1"></script>
    <script src="data-service.js?v=20261113-full-data-gate-v1"></script>
    <script src="access-ui.js?v=20261028-access-v1"></script>
    <script src="cloud-service.js?v=20261030-offline-queue-v3"></script>
    <script src="apps-script/ContractService.js?v=20261111-payment-deadlines-v1"></script>
    <script src="vpi-service.js?v=20261021-vpi-v1"></script>
    <script src="calc-service.js?v=20261106-meter-overflow-v1"></script>
    <script src="heating-oil-service.js?v=20261106-heizoel-v3"></script>
    <script>window.heatingOilService = heatingOilService;</script>

    <script type="module">
      import { VALIDATION_STATUS, validateZaehlerstand } from './validation-service.js?v=20260702-consumption-views-v7';

      window.validationService = {
        VALIDATION_STATUS,
        validateZaehlerstand
      };
    </script>

    <script src="consumption-charts.js?v=20261106-heizoel-v3"></script>
    <script src="ui-service.js?v=20261109-save-feedback-v1"></script>
    <script src="contract-ui.js?v=20261022-contracts-v4"></script>
    <script src="payment-ui.js?v=20261114-payment-duplicate-warning-v1"></script>

    <script>
    async function initApp() {
        const statusEl = document.getElementById('sync-status');
        environmentService.render();
        // Offene Offline-Einträge sofort anzeigen, auch wenn das Laden der Daten scheitert.
        uiService.renderSyncQueueStatus();
        console.log("System: Starte Initialisierung (Stufe 1)...");

        if (!CONFIG.API_CONFIGURED) {
            if (statusEl) {
                statusEl.textContent = "⚠️ Keine Umgebung konfiguriert – bitte runtime-config.js anlegen";
                statusEl.style.color = "darkorange";
            }
            return;
        }

        try {
            // STUFE 1: Schneller Ladevorgang (nur Dashboard-Tabelle)
            const fastData = await cloudService.loadDashboardData();
            if (fastData) {
                dataService.setDashboardData(fastData);
                uiService.renderAll();

                if (statusEl) {
                    statusEl.textContent = "✅ UI bereit. Lade Hintergrunddaten...";
                    statusEl.style.color = "orange";
                }
            }

            // STUFE 2: Hintergrund-Ladevorgang (der schwere Rest)
            const fullData = await cloudService.loadBackgroundData();
            if (fullData && typeof fullData === 'object' && !Array.isArray(fullData)
                && Object.keys(fullData).length > 0) {
                dataService.setInitialData(fullData);

                // A view opened while the background request was running may have
                // rendered with the fast dashboard data. Refresh it after the full
                // contract/payment state has arrived.
                if (document.getElementById('contracts-section')?.style.display === 'block'
                    && typeof contractUiService !== 'undefined') {
                    contractUiService.render();
                }
                if (document.getElementById('payments-section')?.style.display === 'block'
                    && typeof paymentUiService !== 'undefined') {
                    paymentUiService.render();
                }

                if (statusEl) {
                    statusEl.textContent = "✅ System vollständig geladen (" + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ")";
                    statusEl.style.color = "green";
                }
            } else {
                const error = new Error('Leere oder ungültige Hintergrunddaten empfangen.');
                error.code = 'FULL_DATA_EMPTY';
                throw error;
            }

            // Hinweis, solange das Backend nicht durch einen Zugangsschlüssel geschützt ist (Übergangsmodus)
            cloudService.loadCapabilities().then(capabilities => {
                if (capabilities && capabilities.backend_version) {
                    environmentService.setBackendVersion(capabilities.backend_version);
                }
                if (capabilities && capabilities.access_protected === false && statusEl) {
                    statusEl.textContent += " ⚠️ Backend ohne Zugangsschlüssel";
                    statusEl.style.color = "darkorange";
                }
            }).catch(() => {});
        } catch (error) {
            console.error("KRITISCHER FEHLER:", error);
            if (typeof paymentUiService !== 'undefined' && typeof dataService !== 'undefined' && dataService.state) {
                dataService.state.fullDataError = true;
                dataService.state.fullDataErrorCode = error && error.code ? error.code : '';
                if (document.getElementById('payments-section')?.style.display === 'block'
                    && typeof paymentUiService.render === 'function') {
                    paymentUiService.render();
                }
            }
            if (statusEl) {
                if (error && error.code === 'UNAUTHORIZED') {
                    statusEl.textContent = "🔒 Zugangsschlüssel erforderlich – hier tippen zum Eingeben";
                    statusEl.style.color = "red";
                    statusEl.style.cursor = "pointer";
                    statusEl.onclick = () => {
                        statusEl.onclick = null;
                        statusEl.style.cursor = "";
                        initApp();
                    };
                } else if (error && error.code === 'CONFIGURATION_ERROR') {
                    statusEl.textContent = "⚠️ Backend-Umgebung ist nicht konfiguriert";
                    statusEl.style.color = "darkorange";
                } else if (error && error.code === 'FULL_DATA_EMPTY') {
                    statusEl.textContent = "❌ Zahlungsdaten konnten nicht vollständig geladen werden";
                    statusEl.style.color = "red";
                } else {
                    statusEl.textContent = "❌ Fehler beim Laden der Daten";
                    statusEl.style.color = "red";
                }
            }
        }
    }

    document.addEventListener('DOMContentLoaded', initApp);
    document.addEventListener('hv-queue-changed', () => uiService.renderSyncQueueStatus());
    // Auslöser für die Nachübertragung: online-Ereignis und Rückkehr zur App. Das online-Ereignis
    // kommt in schlechten Netzen nicht zuverlässig, deshalb zusätzlich begrenzte Wiederholungen im Cloud-Service.
    window.addEventListener('online', () => { cloudService.processOfflineQueue({ force: true }); });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') cloudService.processOfflineQueue({ force: true });
    });
    // Nach bestätigter Nachübertragung die Zählerstände aus der Datenbank neu lesen.
    document.addEventListener('hv-queue-synced', async () => {
        try {
            dataService.setZaehlerstaende(await cloudService.loadZaehlerstaende());
        } catch (error) {
            console.warn('Zählerstände konnten nach der Synchronisation nicht nachgeladen werden:', error);
        }
    });
    </script>
</body>
</html>
