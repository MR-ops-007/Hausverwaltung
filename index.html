<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hausverwaltung Prototyp</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hausverwaltung">
    <link rel="manifest" href="manifest.webmanifest?v=20261111-pwa-v1">
    <link rel="icon" type="image/png" href="favicon.png?v=20261022">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=20261111-pwa-v1">
    <link rel="stylesheet" href="style.css?v=20261125-consumption-cache-v1">
</head>
<body>
    <div class="container" style="max-width: 1180px; margin: 0 auto; padding: 20px; font-family: sans-serif;">
        <header style="border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px;">
            <h1 style="margin: 0;">Hausverwaltung</h1>
            <div id="sync-status" style="font-size: 0.85em; margin-top: 5px; color: #666;">Prüfe Verbindung...</div>
            <div id="sync-queue-status" class="sync-queue-status" role="status" aria-live="polite" style="display:none;"></div>
            <details id="request-diagnostics" class="request-diagnostics" hidden>
                <summary id="request-diagnostics-summary"></summary>
                <ol id="request-diagnostics-list"></ol>
                <button type="button" id="request-diagnostics-clear">Protokoll leeren</button>
                <button type="button" id="local-cache-clear" title="Entfernt den auf diesem Gerät gespeicherten Datenstand aller Umgebungen">Lokale Daten löschen</button>
                <p id="local-cache-info" class="request-diagnostics-note">Für den Sofortstart speichert die App den zuletzt geladenen Stand (ohne Verbrauchsdaten) auf diesem Gerät.</p>
            </details>
            <div id="environment-banner" class="environment-banner" role="status" hidden>
                <div>
                    <strong id="environment-banner-label"></strong>
                    <span id="environment-banner-meta"></span>
                </div>
                <label class="environment-switch-label" for="environment-switch">
                    Umgebung
                    <select id="environment-switch" aria-label="Laufzeitumgebung wechseln" hidden></select>
                </label>
            </div>
        </header>

        <nav style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
            <button id="nav-meter-entry" class="tab-btn-active" onclick="uiService.showMeterEntryView()" style="padding:10px 14px; cursor:pointer;">
                Zähler
            </button>
            <button id="nav-consumption-dashboard" class="tab-btn-inactive" onclick="uiService.showConsumptionDashboard()" style="padding:10px 14px; cursor:pointer;">
                Verbrauch
            </button>
            <button id="nav-contracts" class="tab-btn-inactive" onclick="contractUiService.show()" style="padding:10px 14px; cursor:pointer;">Verträge</button>
            <button id="nav-payments" class="tab-btn-inactive" onclick="paymentUiService.show()" style="padding:10px 14px; cursor:pointer;">Mieteingänge</button>
        </nav>

        <section id="contracts-section" style="display:none;">
            <h2>Mietverträge</h2>
            <div id="contracts-output"></div>
        </section>

        <section id="object-selector-section">
            <h2 style="font-size: 1.1em; color: #444;">Haus auswählen:</h2>
            <div id="object-selector">Lade Objekte...</div>
        </section>

        <section id="unit-list-section" style="margin-top: 20px; display: none;">
            <div id="tenant-list"></div>
        </section>

        <section id="consumption-dashboard-section" style="display:none;">
            <div style="display:grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 180px); gap:10px; align-items:end; margin-bottom:12px;">
                <label style="display:flex; flex-direction:column; gap:4px; font-weight:700; color:#334155;">
                    Objekt
                    <select id="consumption-object-select" onchange="this.dataset.userSelected='true'; uiService.renderConsumptionDashboard()"></select>
                </label>
                <label style="display:flex; flex-direction:column; gap:4px; font-weight:700; color:#334155;">
                    Jahr
                    <select id="consumption-year-select" onchange="this.dataset.userSelected='true'; uiService.renderConsumptionDashboard()"></select>
                </label>
            </div>

            <label style="display:flex; align-items:center; gap:8px; margin-bottom:14px; color:#475569; font-weight:700;">
                <input id="consumption-include-calculated" type="checkbox" checked onchange="uiService.renderConsumptionDashboard()" style="width:auto;">
                berechnete Zähler anzeigen
            </label>

            <label style="display:flex; flex-direction:column; gap:4px; max-width:280px; margin-bottom:14px; font-weight:700; color:#334155;">
                Tabellenfilter
                <select id="consumption-status-filter" onchange="uiService.renderConsumptionDashboard()">
                    <option value="all">Alle Zähler</option>
                    <option value="missing">Nur fehlende Werte</option>
                    <option value="warnings">Nur Warnungen</option>
                </select>
            </label>

            <div class="consumption-refresh-bar">
                <button id="refresh-consumption-views" class="btn-primary" type="button" onclick="uiService.refreshConsumptionViews()">
                    Verbrauchsdaten aktualisieren
                </button>
                <span id="consumption-view-refresh-status" class="consumption-refresh-status" role="status" aria-live="polite"></span>
            </div>

            <div id="consumption-dashboard-output"></div>
        </section>

        <section id="payments-section" style="display:none;">
            <div id="payments-output"></div>
        </section>

        <div id="modal-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; padding:16px; overflow:auto;">
            <div style="background:white; width:min(100%, 960px); max-height:calc(100vh - 32px); margin:0 auto; padding:24px 28px; border-radius:16px; position:relative; overflow:auto;">
                <span style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer;" onclick="uiService.closeModal()">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>
    
    <!-- Optional: lokale Test-/Produktionsauswahl, niemals committen. -->
    <script src="runtime-secrets.js?v=20261120-local-secrets-v2" onerror="this.remove()"></script>
    <script src="runtime-config.js?v=20261120-runtime-config-v2" onerror="this.remove()"></script>
    <script src="config.js?v=20260707-consumption-dashboard-controls-v1"></script>
    <script src="environment-service.js?v=20261110-environment-switch-v1"></script>
    <script src="data-service.js?v=20261125-stale-guard-v1"></script>
    <script src="access-ui.js?v=20261028-access-v1"></script>
    <script src="local-cache.js?v=20261125-required-sheets-v2"></script>
    <script src="cloud-service.js?v=20261125-datenstand-v1"></script>
    <script src="apps-script/ContractService.js?v=20261117-p6-7-enforcement-v3"></script>
    <script src="apps-script/PaymentRules.js?v=20261117-p6-2-payment-rules-v1"></script>
    <script src="vpi-service.js?v=20261021-vpi-v1"></script>
    <script src="calc-service.js?v=20261106-meter-overflow-v1"></script>
    <script src="heating-oil-service.js?v=20261106-heizoel-v3"></script>
    <script>window.heatingOilService = heatingOilService;</script>

    <script type="module">
      import { VALIDATION_STATUS, validateZaehlerstand } from './validation-service.js?v=20260702-consumption-views-v7';

      window.validationService = {
        VALIDATION_STATUS,
        validateZaehlerstand
      };
    </script>

    <script src="consumption-charts.js?v=20261106-heizoel-v3"></script>
    <script src="ui-service.js?v=20261125-datenstand-v1"></script>
    <script src="contract-ui.js?v=20261125-stale-guard-v1"></script>
    <script src="payment-ui.js?v=20261125-stale-guard-v1"></script>

    <script>
    // Bereits geöffnete Vertrags- oder Zahlungsansicht nach neuen Daten neu zeichnen.
    function renderVisibleDataViews() {
        if (document.getElementById('contracts-section')?.style.display === 'block'
            && typeof contractUiService !== 'undefined') {
            contractUiService.render();
        }
        if (document.getElementById('payments-section')?.style.display === 'block'
            && typeof paymentUiService !== 'undefined') {
            paymentUiService.render();
        }
    }

    function setStatus(statusEl, text, color, onclick = null) {
        if (!statusEl) return;
        statusEl.textContent = text;
        statusEl.style.color = color;
        statusEl.style.cursor = onclick ? "pointer" : "";
        statusEl.onclick = onclick ? () => {
            statusEl.onclick = null;
            statusEl.style.cursor = "";
            onclick();
        } : null;
    }

    async function initApp() {
        const statusEl = document.getElementById('sync-status');
        environmentService.render();
        // Offene Offline-Einträge sofort anzeigen, auch wenn das Laden der Daten scheitert.
        uiService.renderSyncQueueStatus();
        console.log("System: Starte Initialisierung (Stufe 1)...");

        if (!CONFIG.API_CONFIGURED) {
            setStatus(statusEl, "⚠️ Keine Umgebung konfiguriert – bitte runtime-config.js anlegen", "darkorange");
            return;
        }

        // STUFE 0: Sofortstart aus dem zuletzt auf diesem Gerät gespeicherten Stand.
        // Nur beim ersten Laden, nie über bereits frisch geladene Daten.
        let snapshot = null;
        if (!dataService.state.fullDataLoaded && typeof localCache !== 'undefined') {
            snapshot = await localCache.load();
            if (snapshot && dataService.applySnapshot(snapshot)) {
                uiService.renderAll();
                renderVisibleDataViews();
                setStatus(statusEl, "🕘 Stand von " + localCache.formatSavedAt(snapshot) + " – wird aktualisiert …", "darkorange");
            } else {
                snapshot = null;
            }
        }

        // Mit gespeichertem Stand fragt die App nur nach, ob sich etwas geändert hat.
        const knownStamp = snapshot && snapshot.stammdaten && snapshot.stammdaten._datenstand
            ? snapshot.stammdaten._datenstand : '';

        try {
            // STUFE 1 und 2 starten gleichzeitig und werden unabhängig voneinander übernommen:
            // Ein langsames oder fehlgeschlagenes Dashboard hält die Stammdaten nicht auf.
            const fastRequest = cloudService.loadDashboardData();
            const fullRequest = cloudService.loadBackgroundData(knownStamp);
            fullRequest.catch(() => {}); // Fehler werden unten beim Warten behandelt

            // STUFE 1: Dashboard (aktive Mieter), sobald es da ist. Kommen die Stammdaten
            // zuerst, wird nur noch die Mieterliste ersetzt (setActiveTenants).
            let fastError = null;
            const fastDone = fastRequest.then(fastData => {
                if (!fastData) return null;
                if (dataService.state.fullDataLoaded) {
                    dataService.setActiveTenants(fastData);
                } else {
                    dataService.setDashboardData(fastData);
                    setStatus(statusEl, "✅ UI bereit. Lade Hintergrunddaten...", "orange");
                }
                uiService.renderAll();
                return fastData;
            }, error => {
                // Nur ein abgelehnter Schlüssel bricht ab; sonst laufen die Stammdaten weiter.
                if (error && error.code === 'UNAUTHORIZED') throw error;
                console.warn("Dashboard-Abruf fehlgeschlagen, Stammdaten laufen weiter:", error);
                fastError = error;
                return null;
            });
            fastDone.catch(() => {}); // wird unten ausgewertet

            // Versionsanzeige parallel laden; scheitert sie, bleibt nur die Anzeige leer.
            const capabilitiesRequest = cloudService.loadCapabilities().then(capabilities => {
                if (capabilities && capabilities.backend_version) {
                    environmentService.setBackendVersion(capabilities.backend_version);
                }
                return capabilities;
            }).catch(() => null);

            // STUFE 2: Stammdaten. Ein abgelehnter Schlüssel im Dashboard-Abruf bricht sofort ab,
            // sonst wird nur auf die Stammdaten gewartet.
            const fullData = await Promise.race([fullRequest, fastDone.then(() => fullRequest)]);
            let savedStammdaten = null;
            if (fullData && fullData.unchanged === true && snapshot) {
                // Gespeicherter Stand ist aktuell: nichts neu übertragen, nur bestätigen.
                dataService.state.dataStale = false;
                dataService.state.cachedAt = '';
                savedStammdaten = snapshot.stammdaten;
                renderVisibleDataViews();
                if (typeof uiService.prefetchConsumptionData === 'function') uiService.prefetchConsumptionData();
                setStatus(statusEl, "✅ System vollständig geladen (" + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ", keine Änderungen)", "green");
            } else if (fullData && typeof fullData === 'object' && !Array.isArray(fullData)
                && fullData.unchanged !== true && Object.keys(fullData).length > 0) {
                dataService.setInitialData(fullData);
                savedStammdaten = fullData;

                // Eine während des Ladens geöffnete Ansicht zeigt jetzt den frischen Stand.
                renderVisibleDataViews();
                // Verbrauchsdaten leise vorladen (nur ohne oder mit veraltetem gespeichertem Stand).
                if (typeof uiService.prefetchConsumptionData === 'function') uiService.prefetchConsumptionData();
                setStatus(statusEl, "✅ System vollständig geladen (" + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ")", "green");
            } else {
                const error = new Error('Leere oder ungültige Hintergrunddaten empfangen.');
                error.code = 'FULL_DATA_EMPTY';
                throw error;
            }

            // Lokal speichern, sobald auch das Dashboard da ist (Anzeige wartet darauf nicht).
            const fastData = await fastDone;
            if (typeof localCache !== 'undefined') {
                localCache.save(fastData || (snapshot && snapshot.dashboard)
                    || { _view_aktive_mieter: dataService.state.view_aktive_mieter }, savedStammdaten);
            }

            if (fastError) {
                // Stammdaten sind aktuell, nur die Mieterliste auf der Startseite fehlt oder ist alt.
                setStatus(statusEl, statusEl.textContent + " ⚠️ Mieterliste nicht aktualisiert – hier tippen zum erneuten Laden", "darkorange", initApp);
            }

            // Hinweis, solange das Backend nicht durch einen Zugangsschlüssel geschützt ist (Übergangsmodus)
            capabilitiesRequest.then(capabilities => {
                if (capabilities && capabilities.access_protected === false && statusEl) {
                    statusEl.textContent += " ⚠️ Backend ohne Zugangsschlüssel";
                    statusEl.style.color = "darkorange";
                }
            }).catch(() => {});
        } catch (error) {
            console.error("KRITISCHER FEHLER:", error);

            if (error && error.code === 'UNAUTHORIZED') {
                // Ein abgelehnter Schlüssel darf keine (zwischengespeicherten) Daten mehr zeigen.
                if (dataService.state.dataStale || dataService.state.fullDataLoaded) {
                    dataService.reset();
                    uiService.renderAll();
                    renderVisibleDataViews();
                }
                if (typeof localCache !== 'undefined') localCache.clear();
                setStatus(statusEl, "🔒 Zugangsschlüssel erforderlich – hier tippen zum Eingeben", "red", initApp);
                return;
            }

            if (dataService.state.dataStale) {
                // Lokaler Stand bleibt sichtbar; Schreibvorgänge bleiben bis zur Aktualisierung gesperrt.
                setStatus(statusEl, "⚠️ Stand von " + localCache.formatSavedAt({ savedAt: dataService.state.cachedAt }) +
                    " – Aktualisierung fehlgeschlagen, hier tippen zum erneuten Laden", "darkorange", initApp);
                return;
            }

            if (typeof paymentUiService !== 'undefined' && typeof dataService !== 'undefined' && dataService.state) {
                dataService.state.fullDataError = true;
                dataService.state.fullDataErrorCode = error && error.code ? error.code : '';
                if (document.getElementById('payments-section')?.style.display === 'block'
                    && typeof paymentUiService.render === 'function') {
                    paymentUiService.render();
                }
            }
            if (error && error.code === 'CONFIGURATION_ERROR') {
                setStatus(statusEl, "⚠️ Backend-Umgebung ist nicht konfiguriert", "darkorange");
            } else if (error && error.code === 'FULL_DATA_EMPTY') {
                setStatus(statusEl, "❌ Zahlungsdaten konnten nicht vollständig geladen werden", "red");
            } else {
                setStatus(statusEl, "❌ Fehler beim Laden der Daten", "red");
            }
        }
    }

    // Ladezeit-Diagnose: zeigt nur Anfrageart, Dauer und Datenmenge, keine Inhalte.
    function renderRequestDiagnostics() {
        const root = document.getElementById('request-diagnostics');
        if (!root || typeof cloudService === 'undefined') return;
        const log = cloudService.getRequestLog();
        root.hidden = log.length === 0;
        if (!log.length) return;
        document.getElementById('request-diagnostics-summary').textContent = 'Ladezeiten: ' + cloudService.requestSummary();
        const list = document.getElementById('request-diagnostics-list');
        list.replaceChildren(...log.slice().reverse().map(entry => {
            const item = document.createElement('li');
            const time = new Date(entry.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            item.textContent = entry.ok
                ? `${time} · ${entry.label} · Netz ${cloudService.formatDuration(entry.ms)} · Auswerten ${cloudService.formatDuration(entry.parseMs)} · ${cloudService.formatBytes(entry.bytes)}`
                : `${time} · ${entry.label} · Fehler nach ${cloudService.formatDuration(entry.ms)}: ${entry.error}`;
            return item;
        }));
    }
    document.addEventListener('hv-request-timing', renderRequestDiagnostics);
    document.addEventListener('DOMContentLoaded', () => {
        renderRequestDiagnostics();
        document.getElementById('request-diagnostics-clear')?.addEventListener('click', () => {
            cloudService.clearRequestLog();
            renderRequestDiagnostics();
        });
        document.getElementById('local-cache-clear')?.addEventListener('click', async event => {
            const button = event.currentTarget;
            if (typeof localCache === 'undefined') return;
            const ok = await localCache.clear({ all: true });
            const info = document.getElementById('local-cache-info');
            if (info) info.textContent = ok
                ? 'Lokale Daten gelöscht. Der nächste Start lädt wieder vollständig vom Server.'
                : 'Lokale Daten konnten nicht gelöscht werden.';
            button.disabled = ok;
        });
    });
    document.addEventListener('DOMContentLoaded', initApp);
    document.addEventListener('hv-queue-changed', () => uiService.renderSyncQueueStatus());
    // Auslöser für die Nachübertragung: online-Ereignis und Rückkehr zur App. Das online-Ereignis
    // kommt in schlechten Netzen nicht zuverlässig, deshalb zusätzlich begrenzte Wiederholungen im Cloud-Service.
    window.addEventListener('online', () => { cloudService.processOfflineQueue({ force: true }); });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') cloudService.processOfflineQueue({ force: true });
    });
    // Nach bestätigter Nachübertragung die Zählerstände aus der Datenbank neu lesen.
    document.addEventListener('hv-queue-synced', async () => {
        try {
            dataService.setZaehlerstaende(await cloudService.loadZaehlerstaende());
        } catch (error) {
            console.warn('Zählerstände konnten nach der Synchronisation nicht nachgeladen werden:', error);
        }
    });
    </script>
</body>
</html>
